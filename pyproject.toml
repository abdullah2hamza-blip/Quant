[project]
name = "quant"
version = "1.0.1"
description = "Reproducible research for adaptive Bitcoin trend following"
readme = "README.md"
authors = [{name = "Abdullah Hamza", email = "abdullah2hamza@gmail.com"}]
license = "MIT"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "matplotlib>=3.9"]

[project.urls]
Repository = "https://github.com/abdullah2hamza-blip/Quant"

[dependency-groups]
dev = [
    "pypdf==6.10.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
quant = "quant:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
