name: Bitcoin bot validation

on:
  push:
    paths: ['bots/btc_trend_bot/**', '.github/workflows/bot.yml']
  pull_request:
    paths: ['bots/btc_trend_bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bots/btc_trend_bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked
      - run: uv run --locked python trend_bot.py doctor
      - run: uv run --locked python research/checks.py
