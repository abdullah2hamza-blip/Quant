name: Research validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'
      - name: Install fixed uv version
        run: python -m pip install uv==0.13.4
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify accounting, inference and workflow controls
        run: uv run --locked pytest -q
      - name: Exercise all registered cases at smoke scale
        run: uv run --locked quant publication-sim --smoke --ledger runs/ci.sqlite
      - name: Exercise separately specified variance and coherence cases
        run: uv run --locked python -m quant.followup run --smoke --output runs/ci-followup --ledger runs/ci.sqlite
